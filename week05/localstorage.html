<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book of Mormon - Favorite Chapters</title>
  <link rel="stylesheet" href="styles/localstorage.css">
</head>
<body>
  <header>
    <h1>📖 Book of Mormon - Favorite Chapters</h1>
  </header>
  
  <main>
    <div class="input-container">
      <label for="favchap">Enter Book and Chapter:</label>
      <input type="text" id="favchap" placeholder="Alma 5" autofocus>
      <button type="button">Add Chapter</button>
    </div>
    
    <!-- Aquí es donde el script insertará los elementos li -->
    <ul id="list"></ul>
  </main>

  <script src="scripts/localstorage.js"></script>
</body>
</html>
