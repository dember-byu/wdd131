<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Dember Perez Colquehuanca">
    <meta name="description" content="A user-friendly product review form to share feedback and ratings on cool fictional products.">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/style.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>

    <!-- El contenedor mantiene todo alineado y está dentro del body -->
    <div class="form-wrapper">

        <!-- Un solo header antes del main y del footer -->
        <header>
            <h1>Product Review</h1>
        </header>

        <!-- Contenido principal -->
        <main>
            <form action="review.html" method="get">
    
    <!-- Product Name Dropdown -->
    <div class="form-group">
        <label for="product-select">Product Name *</label>
        <select id="product-select" name="productName" required>
            <option value="" disabled selected>Select a Product ...</option>
        </select>
    </div>

    <!-- Overall Rating Radio Buttons (Separated Labels with FOR attributes) -->
    <div class="form-group">
        <label>Overall Rating *</label>
        <div class="rating-container">
            <input type="radio" id="rate-1" name="rating" value="1" required>
            <label for="rate-1">1 ☆</label>

            <input type="radio" id="rate-2" name="rating" value="2" required>
            <label for="rate-2">2 ☆</label>

            <input type="radio" id="rate-3" name="rating" value="3" required>
            <label for="rate-3">3 ☆</label>

            <input type="radio" id="rate-4" name="rating" value="4" required>
            <label for="rate-4">4 ☆</label>

            <input type="radio" id="rate-5" name="rating" value="5" required>
            <label for="rate-5">5 ☆</label>
        </div>
    </div>

    <!-- Date of Installation -->
    <div class="form-group">
        <label for="install-date">Date of Installation *</label>
        <input type="date" id="install-date" name="installDate" required>
    </div>

    <!-- Useful Features Checkboxes (Separated Labels with FOR attributes) -->
    <div class="form-group">
        <label>Useful Features (Check all that apply)</label>
        <div class="checkbox-container">
            <input type="checkbox" id="feat-durability" name="features" value="durability">
            <label for="feat-durability">Durability</label>

            <input type="checkbox" id="feat-design" name="features" value="design">
            <label for="feat-design">Design</label>

            <input type="checkbox" id="feat-performance" name="features" value="performance">
            <label for="feat-performance">Performance</label>

            <input type="checkbox" id="feat-ease" name="features" value="ease-of-use">
            <label for="feat-ease">Ease of Use</label>
        </div>
    </div>

    <!-- Written Review -->
    <div class="form-group">
        <label for="written-review">Written Review</label>
        <textarea id="written-review" name="writtenReview" rows="4" placeholder="Write your review here..."></textarea>
    </div>

    <!-- User Name -->
    <div class="form-group">
        <label for="user-name">User Name</label>
        <input type="text" id="user-name" name="userName" placeholder="e.g. Jane Doe">
    </div>

    <!-- Submit Button -->
    <input type="submit" value="Submit Review">
</form>

        </main>

        <!-- Un solo footer al final del documento, dentro del body -->
        <footer>
            <p>&copy;2026 😎 Dember Perez Colquehuanca 😎</p>
            <p>Cochabamba</p>
            <p>Last Modification: <span id="last-mod-date">02/26/2024 13:56:10</span></p>
        </footer>

    </div> <!-- Fin del form-wrapper -->

</body>
</html>
