<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/style.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>

    <main>
        <h1>Product Review</h1>
        <!-- Using GET method so data is visible in the URL bar for GitHub support -->
        <form action="review.html" method="get">
            
            <!-- Product Name Dropdown -->
            <div class="form-group">
                <label for="product-select">Product Name *</label>
                <select id="product-select" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                    <!-- Options will be dynamically populated here by form.js -->
                </select>
            </div>

            <!-- Overall Rating Radio Buttons -->
            <div class="form-group">
                <label>Overall Rating *</label>
                <div class="rating-container">
                    <!-- Sharing the same name groups them together dynamically -->
                    <label><input type="radio" id="rate-1" name="rating" value="1" required> 1 ☆</label>
                    <label><input type="radio" id="rate-2" name="rating" value="2" required> 2 ☆</label>
                    <label><input type="radio" id="rate-3" name="rating" value="3" required> 3 ☆</label>
                    <label><input type="radio" id="rate-4" name="rating" value="4" required> 4 ☆</label>
                    <label><input type="radio" id="rate-5" name="rating" value="5" required> 5 ☆</label>
                </div>
            </div>

            <!-- Date of Installation -->
            <div class="form-group">
                <label for="install-date">Date of Installation *</label>
                <input type="date" id="install-date" name="installDate" required>
            </div>

            <!-- Useful Features Checkboxes -->
            <div class="form-group">
                <label>Useful Features (Check all that apply)</label>
                <div class="checkbox-container">
                    <label><input type="checkbox" id="feat-durability" name="features" value="durability"> Durability</label>
                    <label><input type="checkbox" id="feat-design" name="features" value="design"> Design</label>
                    <label><input type="checkbox" id="feat-performance" name="features" value="performance"> Performance</label>
                </div>
            </div>

            <!-- Written Review (Optional Textarea) -->
            <div class="form-group">
                <label for="written-review">Written Review</label>
                <textarea id="written-review" name="writtenReview" rows="4" placeholder="Write your review here..."></textarea>
            </div>

            <!-- User Name (Optional Input) -->
            <div class="form-group">
                <label for="user-name">User Name</label>
                <input type="text" id="user-name" name="userName" placeholder="e.g. Jane Doe">
            </div>

            <!-- Submit Button -->
            <input type="submit" value="Submit Review">
        </form>
    </main>

    <footer>
    <p>&copy;2026 😎 Dember Perez Colquehuanca 😎</p>
    <p>Cochabamba</p>
    <p>Last Modification: <span id="last-mod-date">02/26/2024 13:56:10</span></p>
</footer>

</body>
</html>
